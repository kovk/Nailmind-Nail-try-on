services:
  nailmind-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nailmind-api
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/data:/app/data
      - ./deploy/models:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
