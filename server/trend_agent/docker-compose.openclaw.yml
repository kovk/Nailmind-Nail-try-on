services:
  nailmind-openclaw-trend-agent:
    image: python:3.12-slim
    container_name: nailmind-openclaw-trend-agent
    working_dir: /workspace/server/trend_agent
    command: >
      sh -lc "pip install --no-cache-dir sqlalchemy pydantic-settings &&
      python main.py"
    env_file:
      - .env.openclaw
    volumes:
      - ../api:/workspace/server/api
      - .:/workspace/server/trend_agent
      - ../api/deploy/data:/app/data
      - /usr/bin/openclaw:/usr/local/bin/openclaw:ro
      - /root/.openclaw:/root/.openclaw:ro
    restart: unless-stopped
