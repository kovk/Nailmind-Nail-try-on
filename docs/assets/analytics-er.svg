<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .table { fill: #f8fafc; stroke: #334155; stroke-width: 1.4; rx: 12; ry: 12; }
      .head { fill: #dbeafe; }
      .name { font: 15px Arial, sans-serif; font-weight: bold; fill: #0f172a; }
      .field { font: 14px Arial, sans-serif; fill: #334155; }
      .line { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font: 20px Arial, sans-serif; font-weight: bold; fill: #0f172a; }
    </style>
  </defs>
  <rect x="0" y="0" width="1320" height="620" fill="#ffffff"/>
  <text x="40" y="36" class="title">运营分析 ER 图</text>

  <g transform="translate(70,100)">
    <rect width="230" height="132" class="table"/>
    <rect width="230" height="28" class="table head"/>
    <text x="12" y="19" class="name">event_logs</text>
    <text x="12" y="50" class="field">id PK</text>
    <text x="12" y="72" class="field">event_id UK</text>
    <text x="12" y="94" class="field">event_name</text>
    <text x="12" y="116" class="field">style_id / store_id</text>
  </g>

  <g transform="translate(400,100)">
    <rect width="240" height="110" class="table"/>
    <rect width="240" height="28" class="table head"/>
    <text x="12" y="19" class="name">style_metrics_daily</text>
    <text x="12" y="50" class="field">style_id FK</text>
    <text x="12" y="72" class="field">metric_date</text>
    <text x="12" y="94" class="field">impressions / clicks</text>
  </g>

  <g transform="translate(780,100)">
    <rect width="220" height="110" class="table"/>
    <rect width="220" height="28" class="table head"/>
    <text x="12" y="19" class="name">trend_topics</text>
    <text x="12" y="50" class="field">id PK</text>
    <text x="12" y="72" class="field">topic_key UK</text>
    <text x="12" y="94" class="field">community_heat_score</text>
  </g>

  <g transform="translate(250,340)">
    <rect width="220" height="110" class="table"/>
    <rect width="220" height="28" class="table head"/>
    <text x="12" y="19" class="name">trend_posts</text>
    <text x="12" y="50" class="field">id PK</text>
    <text x="12" y="72" class="field">topic_id FK</text>
    <text x="12" y="94" class="field">post_id / url</text>
  </g>

  <g transform="translate(620,340)">
    <rect width="260" height="132" class="table"/>
    <rect width="260" height="28" class="table head"/>
    <text x="12" y="19" class="name">trend_recommendations</text>
    <text x="12" y="50" class="field">id PK</text>
    <text x="12" y="72" class="field">recommendation_code UK</text>
    <text x="12" y="94" class="field">recommendation_type</text>
    <text x="12" y="116" class="field">status</text>
  </g>

  <path d="M300 165 L400 155" class="line"/>
  <path d="M1000 155 L620 390" class="line"/>
  <path d="M890 210 L470 390" class="line"/>
  <path d="M470 390 L620 390" class="line"/>
</svg>
