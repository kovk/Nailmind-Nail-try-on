<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box { rx: 14; ry: 14; stroke: #334155; stroke-width: 1.5; }
      .title { font: 20px Arial, sans-serif; font-weight: bold; fill: #0f172a; }
      .label { font: 16px Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 12px Arial, sans-serif; fill: #64748b; text-anchor: middle; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="300" fill="#ffffff"/>
  <text x="40" y="36" class="title">NailClaw 记忆闭环</text>

  <rect x="60" y="110" width="180" height="70" class="box" fill="#fef3c7"/>
  <text x="150" y="136" class="small">输入证据</text>
  <text x="150" y="156" class="label">社区样本</text>

  <rect x="310" y="110" width="180" height="70" class="box" fill="#dcfce7"/>
  <text x="400" y="136" class="small">分析阶段</text>
  <text x="400" y="156" class="label">NailClawAgent</text>

  <rect x="560" y="110" width="180" height="70" class="box" fill="#fee2e2"/>
  <text x="650" y="136" class="small">当前已落库</text>
  <text x="650" y="156" class="label">建议与趋势结果</text>

  <rect x="810" y="110" width="180" height="70" class="box" fill="#eff6ff"/>
  <text x="900" y="136" class="small">人工处理</text>
  <text x="900" y="156" class="label">采纳 / 拒绝 / 备注</text>

  <rect x="1060" y="110" width="180" height="70" class="box" fill="#dcfce7"/>
  <text x="1150" y="136" class="small">建议扩展</text>
  <text x="1150" y="156" class="label">业务记忆库</text>

  <path d="M240 145 L310 145" class="line"/>
  <path d="M490 145 L560 145" class="line"/>
  <path d="M740 145 L810 145" class="line"/>
  <path d="M990 145 L1060 145" class="line"/>
  <path d="M1150 110 C1150 60, 650 60, 650 110" class="line"/>
</svg>
