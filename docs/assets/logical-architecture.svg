<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .group { fill: none; stroke-width: 2; stroke-dasharray: 7 5; rx: 18; ry: 18; }
      .box { rx: 14; ry: 14; stroke: #334155; stroke-width: 1.5; }
      .title { font: 17px Arial, sans-serif; font-weight: bold; fill: #0f172a; }
      .label { font: 16px Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 12px Arial, sans-serif; fill: #64748b; text-anchor: middle; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="560" fill="#ffffff"/>

  <rect x="45" y="95" width="210" height="120" class="group" stroke="#60a5fa"/>
  <text x="70" y="125" class="title">app/</text>
  <rect x="80" y="145" width="140" height="50" class="box" fill="#eff6ff"/>
  <text x="150" y="171" class="label">用户端</text>

  <rect x="1015" y="95" width="220" height="120" class="group" stroke="#60a5fa"/>
  <text x="1040" y="125" class="title">web-admin/</text>
  <rect x="1055" y="145" width="140" height="50" class="box" fill="#eff6ff"/>
  <text x="1125" y="171" class="label">后台端</text>

  <rect x="315" y="55" width="650" height="430" class="group" stroke="#4ade80"/>
  <text x="340" y="85" class="title">backend/</text>

  <rect x="560" y="115" width="160" height="56" class="box" fill="#dcfce7"/>
  <text x="640" y="140" class="small">统一接口入口</text>
  <text x="640" y="156" class="label">FastAPI API</text>

  <rect x="385" y="240" width="220" height="74" class="box" fill="#dcfce7"/>
  <text x="495" y="267" class="small">认证、门店、预约、收藏</text>
  <text x="495" y="288" class="label">业务服务</text>

  <rect x="675" y="240" width="220" height="74" class="box" fill="#dcfce7"/>
  <text x="785" y="267" class="small">AI 试戴、埋点评测、趋势分析</text>
  <text x="785" y="288" class="label">能力服务</text>

  <rect x="520" y="375" width="240" height="64" class="box" fill="#fee2e2"/>
  <text x="640" y="401" class="small">SQLite、图片文件、运行数据</text>
  <text x="640" y="420" class="label">数据存储</text>

  <rect x="1015" y="295" width="220" height="120" class="group" stroke="#fbbf24"/>
  <text x="1040" y="325" class="title">外部依赖</text>
  <rect x="1055" y="345" width="140" height="50" class="box" fill="#fef3c7"/>
  <text x="1125" y="371" class="label">大模型 / 社区源</text>

  <path d="M220 170 L560 143" class="line"/>
  <path d="M1055 170 L720 146" class="line"/>
  <path d="M640 171 L495 240" class="line"/>
  <path d="M640 171 L785 240" class="line"/>
  <path d="M495 314 L590 375" class="line"/>
  <path d="M785 314 L690 375" class="line"/>
  <path d="M895 277 L1055 370" class="line"/>
</svg>
