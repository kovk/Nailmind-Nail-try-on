<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 20px Arial, sans-serif; font-weight: bold; fill: #0f172a; }
      .actor { font: 16px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 1.4; rx: 10; ry: 10; }
      .lifeline { stroke: #94a3b8; stroke-dasharray: 6 4; stroke-width: 1.5; }
      .msg { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .label { font: 15px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="1280" height="460" fill="#ffffff"/>
  <text x="40" y="36" class="title">AI 试戴流程</text>

  <rect x="60" y="60" width="120" height="42" class="box" fill="#dbeafe"/>
  <text x="120" y="86" class="actor">用户</text>
  <rect x="300" y="60" width="150" height="42" class="box" fill="#e0f2fe"/>
  <text x="375" y="86" class="actor">app/android</text>
  <rect x="560" y="60" width="170" height="42" class="box" fill="#dcfce7"/>
  <text x="645" y="86" class="actor">backend/api</text>
  <rect x="850" y="60" width="150" height="42" class="box" fill="#fee2e2"/>
  <text x="925" y="86" class="actor">DATA_DIR</text>
  <rect x="1080" y="60" width="150" height="42" class="box" fill="#fef3c7"/>
  <text x="1155" y="86" class="actor">大模型</text>

  <line x1="120" y1="102" x2="120" y2="400" class="lifeline"/>
  <line x1="375" y1="102" x2="375" y2="400" class="lifeline"/>
  <line x1="645" y1="102" x2="645" y2="400" class="lifeline"/>
  <line x1="925" y1="102" x2="925" y2="400" class="lifeline"/>
  <line x1="1155" y1="102" x2="1155" y2="400" class="lifeline"/>

  <path d="M120 145 L375 145" class="msg"/>
  <text x="185" y="137" class="label">选择款式并上传手图</text>

  <path d="M375 200 L645 200" class="msg"/>
  <text x="450" y="192" class="label">提交试戴请求</text>

  <path d="M645 255 L925 255" class="msg"/>
  <text x="730" y="247" class="label">查缓存并保存结果</text>

  <path d="M645 310 L1155 310" class="msg"/>
  <text x="785" y="302" class="label">未命中时调用大模型生成</text>

  <path d="M645 365 L375 365" class="msg"/>
  <text x="500" y="357" class="label">返回试戴结果</text>
</svg>
