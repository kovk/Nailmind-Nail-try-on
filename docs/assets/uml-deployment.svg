      .head { font: 16px Arial, sans-serif; font-weight: bold; fill: #0f172a; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .text { font: 14px Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

