<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 20px Arial, sans-serif; font-weight: bold; fill: #0f172a; }
      .actor { font: 16px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 1.4; rx: 10; ry: 10; }
      .lifeline { stroke: #94a3b8; stroke-dasharray: 6 4; stroke-width: 1.5; }
      .msg { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .label { font: 15px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="1280" height="440" fill="#ffffff"/>
  <text x="40" y="36" class="title">运营侧趋势处理流程</text>

  <rect x="60" y="60" width="140" height="42" class="box" fill="#dbeafe"/>
  <text x="130" y="86" class="actor">运营人员</text>
  <rect x="300" y="60" width="150" height="42" class="box" fill="#e0f2fe"/>
  <text x="375" y="86" class="actor">web-admin</text>
  <rect x="560" y="60" width="170" height="42" class="box" fill="#dcfce7"/>
  <text x="645" y="86" class="actor">backend/api</text>
  <rect x="850" y="60" width="150" height="42" class="box" fill="#dcfce7"/>
  <text x="925" y="86" class="actor">NailClaw</text>
  <rect x="1080" y="60" width="150" height="42" class="box" fill="#fef3c7"/>
  <text x="1155" y="86" class="actor">社区内容源</text>

  <line x1="130" y1="102" x2="130" y2="380" class="lifeline"/>
  <line x1="375" y1="102" x2="375" y2="380" class="lifeline"/>
  <line x1="645" y1="102" x2="645" y2="380" class="lifeline"/>
  <line x1="925" y1="102" x2="925" y2="380" class="lifeline"/>
  <line x1="1155" y1="102" x2="1155" y2="380" class="lifeline"/>

  <path d="M130 145 L375 145" class="msg"/>
  <text x="210" y="137" class="label">进入运营后台</text>

  <path d="M375 200 L645 200" class="msg"/>
  <text x="455" y="192" class="label">查看或刷新趋势数据</text>

  <path d="M645 255 L925 255" class="msg"/>
  <text x="725" y="247" class="label">启动趋势分析</text>

  <path d="M925 310 L1155 310" class="msg"/>
  <text x="990" y="302" class="label">抓取社区内容</text>

  <path d="M925 365 L645 365" class="msg"/>
  <text x="735" y="357" class="label">返回候选建议</text>
</svg>
