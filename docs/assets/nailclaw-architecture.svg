<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .group { fill: none; stroke-width: 2; stroke-dasharray: 7 5; rx: 18; ry: 18; }
      .box { rx: 14; ry: 14; stroke: #334155; stroke-width: 1.5; }
      .title { font: 18px Arial, sans-serif; font-weight: bold; fill: #0f172a; }
      .label { font: 16px Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 12px Arial, sans-serif; fill: #64748b; text-anchor: middle; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1440" height="700" fill="#ffffff"/>

  <rect x="40" y="90" width="240" height="170" class="group" stroke="#fbbf24"/>
