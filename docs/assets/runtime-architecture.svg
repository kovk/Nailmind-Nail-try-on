<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="320" viewBox="0 0 1320 320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box { rx: 14; ry: 14; stroke: #334155; stroke-width: 1.5; }
      .title { font: 20px Arial, sans-serif; font-weight: bold; fill: #0f172a; }
      .label { font: 18px Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 12px Arial, sans-serif; fill: #64748b; text-anchor: middle; }
      .line { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1320" height="320" fill="#ffffff"/>
  <text x="40" y="36" class="title">运行结构图</text>

  <rect x="60" y="110" width="180" height="70" class="box" fill="#e0f2fe"/>
  <text x="150" y="136" class="small">用户侧</text>
  <text x="150" y="156" class="label">Android App</text>

  <rect x="310" y="110" width="180" height="70" class="box" fill="#e0f2fe"/>
  <text x="400" y="136" class="small">后台访问入口</text>
  <text x="400" y="156" class="label">管理端浏览器</text>

  <rect x="560" y="110" width="180" height="70" class="box" fill="#dcfce7"/>
  <text x="650" y="136" class="small">静态资源</text>
  <text x="650" y="156" class="label">web-admin</text>

  <rect x="810" y="110" width="180" height="70" class="box" fill="#dcfce7"/>
  <text x="900" y="136" class="small">统一接口入口</text>
  <text x="900" y="156" class="label">backend/api</text>

  <rect x="1060" y="60" width="180" height="60" class="box" fill="#fee2e2"/>
  <text x="1150" y="93" class="label">SQLite</text>

  <rect x="1060" y="135" width="180" height="60" class="box" fill="#fee2e2"/>
  <text x="1150" y="168" class="label">DATA_DIR</text>

  <rect x="1060" y="210" width="180" height="60" class="box" fill="#fef3c7"/>
  <text x="1150" y="243" class="label">大模型 / 社区源</text>

  <path d="M240 145 L810 145" class="line"/>
  <path d="M490 145 L560 145" class="line"/>
  <path d="M740 145 L810 145" class="line"/>
  <path d="M990 100 L1060 100" class="line"/>
  <path d="M990 165 L1060 165" class="line"/>
  <path d="M990 230 L1060 230" class="line"/>
</svg>
